name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  windows:
    name: Build Windows x64
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo build --locked --bin fake_steamcmd
          cargo test --locked

      - name: Build release
        run: cargo build --release --locked --bin onyx

      - name: Package
        shell: pwsh
        run: |
          $name = "onyx-$env:GITHUB_REF_NAME-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/onyx.exe "dist/$name/"
          Copy-Item README.md "dist/$name/"
          Copy-Item assets/fonts/LICENSES.md "dist/$name/FONT-LICENSES.md"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$name.zip.sha256", "$hash  $name.zip`n")

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          $version = "$env:GITHUB_REF_NAME".TrimStart("v")
          $name = "onyx-$env:GITHUB_REF_NAME-windows-x64-setup"
          & $iscc "/DAppVersion=$version" "/DOutputName=$name" "/DSourceExe=$PWD/target/release/onyx.exe" "/DOutputDir=$PWD/dist" installer/onyx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash "dist/$name.exe" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/$name.exe.sha256", "$hash  $name.exe`n")

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  linux:
    name: Build Linux x64
    needs: version
    # Oldest supported runner, so the binary links against an older glibc
    # and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo build --locked --bin fake_steamcmd
          cargo test --locked

      - name: Build release
        run: cargo build --release --locked --bin onyx

      - name: Package
        run: |
          name="onyx-$GITHUB_REF_NAME-linux-x64"
          mkdir -p "dist/$name"
          cp target/release/onyx "dist/$name/"
          cp README.md "dist/$name/"
          cp assets/fonts/LICENSES.md "dist/$name/FONT-LICENSES.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Draft release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
